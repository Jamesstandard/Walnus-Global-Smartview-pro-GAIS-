    <script>
      (function() {
        try {
          var saved = localStorage.getItem('paint_sync_theme_settings_v2');
          var theme = saved ? JSON.parse(saved) : null;
          var mode = theme ? theme.mode : 'dark';
          var accent = theme ? theme.accent : 'indigo';
          var compact = theme ? theme.compactDensity : true;
          
          var isDark = mode === 'dark';
          if (mode === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
          
          root.classList.add('theme-' + accent);
          if (compact) {
            root.setAttribute('data-density', 'compact');
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
